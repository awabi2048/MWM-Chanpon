gui:
  common:
    separator: "§8§m――――――――――――――――――――――――――――"
    action_single: "§e§nClick to {action}"
    action_multi: "§e§l| §e{operation} §7{action}"
    warning: "§c§n※ {content}"
    back: "§c§lBack"
    cancel: "§c§lCancel"
    close_message: "§eThe creation wizard has ended."
    expired_message: "§cThe creation session has expired."
