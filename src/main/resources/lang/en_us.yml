        name_placeholder: "Enter world name"
        description: "New Description"
        description_placeholder: "Enter description"
    icon:
      display: "§aChange World Icon"
      current_prefix: "§f§l| §7Current Icon "
      description_line: "§7After clicking, select an item in your inventory."
      action: "start icon selection mode"
    spawn:
      display: "§aWorld Spawn Settings"
      type:
        guest: "Guest"
        member: "Member"
        both: "Guest/Member"
      description:
        - "After clicking, click the block at the target position"
        - "to confirm the spawn point."
        - "§e* Your facing direction is saved as well"
      description_bedrock:
        - "The clicked position is applied to both guest and member spawn."
        - "§e* Your facing direction is saved as well"
      left_action: "set guest spawn"
      right_action: "set member spawn"
      bedrock_action: "set guest/member shared spawn"
    expand:
      display: "§6World Expansion"
      description:
        - "Current border size: {size}"
        - "Expands the border by one step."
      action: "expand the world border"
    publish:
      display: "§6Change Visibility"
      description:
        - "§f§l| §7Current Setting {level}"
        - "{detail}"
      detail:
        public: "§fAnyone can visit this world."
        wip: "§fOnly members can visit this world."
        closed: "§fNon-members cannot visit this world."
      option:
        public: "§aPublic"
        wip: "§eIn Progress"
        closed: "§cPrivate"
      option_active: "§6» {level}"
      option_inactive: "  {level}"
      action_bedrock: "switch to the next visibility level"
      action_previous: "move to the previous visibility level"
      action_next: "move to the next visibility level"
    members:
      display: "§6Member Management"
      description:
        - "Current Member Count: {count}"
        - "Access: {access}"
      access_owner: "§aCan invite and remove members"
      access_member: "§7View only"
      action_owner: "open member management"
      action_member: "open member list"
    tags:
      display: "§aWorld Tag Settings"
      description:
        - "Configured Tags: {count}"
        - "Current Tags: {tags}"
      action: "edit tags"
    announcement:
      display: "§aVisitor Guide Settings"
      description:
        - "Current Guide: {message}"
        - "Visitors can use it as a short guide for the world."
      action: "edit visitor guide"
      form:
        title: "Visitor Guide Settings"
        message: "Enter up to {max_lines} lines, {max_length} characters per line. Blank lines are not saved."
        line: "Line {number}"
        reset: "Reset"
    notification:
      display: "§aToggle Visit Notifications"
      description:
        - "Current Setting: {status}"
        - "Toggle whether non-members trigger a notification."
      action: "toggle visit notifications"
    environment:
      display: "§aWorld Environment Settings"
      description:
        - "Change loaded-world weather and time."
        - "These changes apply immediately to the current world."
      action: "open environment settings"
  world_environment:
    title: "World Environment ({world})"
    weather:
      display: "§aWeather"
      description:
        - "Switches between clear weather and rain."
      action: "toggle weather"
      clear: "Clear"
      rain: "Rain"
    time:
      display: "§aTime"
      description:
        - "Switches between day and night."
      action: "toggle time"
      day: "Day"
      night: "Night"
