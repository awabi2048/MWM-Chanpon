      description_random: "Random Generation"
      description_seed: "Seed: {seed}"
      name_line: "World Name: {name}"
      action: "create the world"
      back_action: "return to the previous screen"
    input:
      world_name:
        title: "World Name Input"
        message: "Please enter the world name."
        label: "World Name"
        back: "return to creation method selection"
      seed:
        title: "Seed Input"
        message: "Please enter the seed value."
        label: "Seed Value"
        back: "return to creation method selection"
      submit: "Confirm"
      back: "Back"
  myworld:
    list:
      title: "My World List"
      create:
        display: "§bCreate New My World"
        action: "start world creation"
      profile:
        display: "§f{player}'s Profile"
        owned: "Owned Worlds"
      personal_settings:
        action: "open personal settings"
      page:
        previous: "§ePrevious Page"
        previous_action: "return to the previous page"
        next: "§eNext Page"
        next_action: "go to the next page"
    world_icon:
      data:
        owner: "Owner"
        publish: "Visibility"
      actions:
        left_click: "Left Click"
        right_click: "Right Click"
        teleport: "teleport to this world"
        settings: "open world settings"
      source:
        random: "Random Generation"
        template: "Template {name}"
        seed: "Seed Value"
      publish:
        public: "§aPublic"
        wip: "§bPrivate"
        closed: "§cClosed"
  personal_settings:
    title: "Personal Settings"
    back_action: "return to My World list"
    language:
      display: "§6Language Settings"
      description:
        - "Current: {language}"
        - "Click to rotate to the next language."
      action: "change language"
