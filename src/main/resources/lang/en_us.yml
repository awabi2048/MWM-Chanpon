      world_name:
        title: "World Name Input"
        message: "Please enter the world name."
        label: "World Name"
        back: "return to creation method selection"
      seed:
        title: "Seed Input"
        message: "Please enter the seed value."
        label: "Seed Value"
        back: "return to creation method selection"
      submit: "Confirm"
      back: "Back"
  myworld:
    list:
      title: "My World List"
      create:
        display: "§bCreate New My World"
        action: "start world creation"
      profile:
        display: "§f{player}'s Profile"
        owned: "Owned Worlds"
      personal_settings:
        action: "open personal settings"
      page:
        previous: "§ePrevious Page"
        previous_action: "return to the previous page"
        next: "§eNext Page"
        next_action: "go to the next page"
    world_icon:
      data:
        owner: "Owner"
        publish: "Visibility"
      actions:
        left_click: "Left Click"
        right_click: "Right Click"
        teleport: "teleport to this world"
        settings: "open world settings"
      source:
        random: "Random Generation"
        template: "Template {name}"
        seed: "Seed Value"
      publish:
        public: "§aPublic"
        wip: "§eIn Progress"
        closed: "§cPrivate"
  personal_settings:
    title: "Personal Settings"
    back_action: "return to My World list"
    language:
      display: "§6Language Settings"
      description:
        - "Current: {language}"
        - "Click to rotate to the next language."
      action: "change language"
  world_settings:
    title: "World Settings ({world})"
    common:
      unset: "Not set"
      must_be_in_world: "You must be inside the target world to change this setting"
    click:
      left: "Left Click"
      right: "Right Click"
    info:
      display: "§aWorld Info Settings"
      description:
        - "World Name: {name}"
        - "World Description: {description}"
      action: "edit world name and description"
      form:
        title: "World Info Settings"
        message: "Enter the world name and description."
        name: "World Name"
        description: "World Description"
    icon:
      display: "§aChange World Icon"
      current_prefix: "§f§l| §7Current Icon "
      description_line: "§7After clicking, select an item in your inventory."
      action: "start icon selection mode"
    spawn:
      display: "§aWorld Spawn Settings"
      description:
        - "This release only shows a message for this setting."
      left_action: "set guest spawn"
      right_action: "set member spawn"
    expand:
      display: "§6World Expansion"
      description:
        - "This release only shows a message for this setting."
      action: "open expansion menu"
    publish:
      display: "§6Change Visibility"
      description:
        - "Current Setting: {level}"
        - "{detail}"
        - "{list}"
      detail:
        public: "§fAnyone can visit this world."
        wip: "§fOnly players invited by members can visit this world."
        closed: "§fNon-members cannot visit this world."
      option:
        public: "§aPublic"
        wip: "§eIn Progress"
        closed: "§cPrivate"
      option_active: "§6» {level}"
      option_inactive: "  {level}"
      action_bedrock: "switch to the next visibility level"
      action_previous: "switch to the previous visibility level"
      action_next: "switch to the next visibility level"
    members:
      display: "§6Member Management"
      description:
        - "Current Member Count: {count}"
        - "This release only shows a message for this setting."
      action: "open member management"
    tags:
      display: "§aWorld Tag Settings"
      description:
        - "Configured Tags: {count}"
        - "This release only shows a message for this setting."
      action: "open tag settings"
    announcement:
      display: "§aVisitor Guide Settings"
      description:
        - "Current Guide: {message}"
        - "This release only shows a message for this setting."
      action: "open guide settings"
    notification:
      display: "§aToggle Visit Notifications"
      description:
        - "Current Setting: {status}"
        - "Toggle whether non-members trigger a notification."
      action: "toggle visit notifications"
    environment:
      display: "§aWorld Environment Settings"
      description:
        - "This release only shows a message for this setting."
      action: "open environment settings"
