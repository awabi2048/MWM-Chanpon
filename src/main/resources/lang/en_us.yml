    expired_message: "§cThe creation session has expired."
    offline_target: "§cThe target player is offline."
  creation:
    method:
      title: "World Creation Method"
      template:
        display: "§6Copy From Template"
        description:
          - "Create a My World by"
          - "copying an existing template."
        action: "open the template list"
        unavailable: "No available templates were found"
      random:
        display: "§aRandom Generation"
        description:
          - "Create a My World by"
          - "generating a normal world."
        action: "go to name input"
      seed:
        display: "§bUse Seed Value"
        description:
          - "Create a My World by"
          - "specifying a seed."
        action: "go to seed input"
      cancel_action: "cancel the wizard"
    template:
      title: "Template Selection"
      action: "select this template"
      back_action: "return to creation method selection"
    confirm:
      title: "Final Confirmation"
      display: "§6Review Creation Settings"
      description_template: "Template: {template}"
      description_random: "Random Generation"
      description_seed: "Seed: {seed}"
      name_line: "World Name: {name}"
      action: "create the world"
      back_action: "return to the previous screen"
    input:
      world_name:
        title: "World Name Input"
        message: "Please enter the world name."
        label: "World Name"
        back: "return to creation method selection"
      seed:
        title: "Seed Input"
        message: "Please enter the seed value."
        label: "Seed Value"
        back: "return to creation method selection"
      submit: "Confirm"
      back: "Back"
  myworld:
    list:
      title: "My World List"
      create:
        display: "§bCreate New My World"
        action: "start world creation"
      profile:
        display: "§f{player}'s Profile"
        owned: "Owned Worlds"
      personal_settings:
        action: "open personal settings"
      page:
        previous: "§ePrevious Page"
        previous_action: "return to the previous page"
        next: "§eNext Page"
        next_action: "go to the next page"
    world_icon:
      data:
        owner: "Owner"
        publish: "Visibility"
      actions:
        left_click: "Left Click"
        right_click: "Right Click"
        teleport: "teleport to this world"
        settings: "open world settings"
      source:
        random: "Random Generation"
        template: "Template {name}"
        seed: "Seed Value"
      publish:
        public: "§aPublic"
        wip: "§eIn Progress"
        closed: "§cPrivate"
