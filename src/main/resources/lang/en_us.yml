    title: "World Settings ({world})"
    common:
      unset: "Not set"
      must_be_in_world: "You must be inside the target world to change this setting"
    click:
      left: "Left Click"
      right: "Right Click"
    info:
      display: "§aWorld Info Settings"
      description:
        - "World Name: {name}"
        - "World Description: {description}"
      action: "edit world name and description"
      form:
        title: "Edit World Info"
        message: "You can edit the world name and description together. Leave the world name blank to keep it unchanged, and leave the description blank to clear it."
