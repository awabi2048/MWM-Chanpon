  creation:
    method:
      title: "World Creation Method"
      template:
        display: "§6Copy From Template"
        description:
          - "Create a My World by"
          - "copying an existing template."
        action: "open the template list"
        unavailable: "No available templates were found"
      random:
        display: "§aRandom Generation"
        description:
          - "Create a My World by"
          - "generating a normal world."
        action: "go to name input"
      seed:
        display: "§bUse Seed Value"
        description:
          - "Create a My World by"
          - "specifying a seed."
        action: "go to seed input"
      cancel_action: "cancel the wizard"
    template:
      title: "Template Selection"
      action: "select this template"
      back_action: "return to creation method selection"
    confirm:
      title: "Final Confirmation"
      display: "§6Review Creation Settings"
      description_template: "Template: {template}"
      description_random: "Random Generation"
      description_seed: "Seed: {seed}"
      name_line: "World Name: {name}"
      action: "create the world"
      back_action: "return to the previous screen"
