    title: "World Tag Editor"
    status: "Status"
    status_active: "§aEnabled"
    status_inactive: "§cDisabled"
    click_toggle: "toggle this tag"
  member_management:
    title: "World Member Management"
    invite:
      display: "§aInvite Member"
      description: "Click, then enter a player name to invite them"
      online_only: "§eOnly online players can be invited"
      force_available: "§eShift + Click to force add"
      normal_only: "§7Normal invite only"
      view_only: "§7Members can only view this screen"
      action: "start inviting"
      view_only_action: "view only"
    page:
      previous: "§ePrevious Page"
      previous_action: "return to the previous page"
      next: "§eNext Page"
      next_action: "go to the next page"
    role:
      owner: "Owner"
      member: "Member"
      invite: "Invited"
    item:
      status: "Status"
      online: "§aOnline"
      offline: "§7Offline"
      sent_at: "Sent At"
      last_online: "Last Online"
      role: "Role"
      remove_action: "§e§l| §eLeft Click §7remove this member"
      cancel_action: "§e§l| §eLeft Click §7cancel this invite"
      owner_name: "{player}"
      member_name: "{player}"
      invite_name: "{player}"
    remove_confirm:
      title: "Confirm Member Removal"
      player_name: "{player}"
      lore:
        - "§cAre you sure you want to remove this member?"
        - "§f§l| §7Player §f{player}"
        - "§f§l| §7World §f{world}"
      cancel: "§aBack"
      confirm: "§cRemove"
      confirm_desc: "§7Remove this player from the world members"
    pending_item:
      name: "{player} (Invited)"
    pending_cancel_confirm:
      title: "Confirm Invite Cancellation"
      body: "§cCancel the member invite for {player}?"
      cancel: "§aBack"
      confirm: "§cExecute"
      confirm_desc: "§7Cancel this invite"
    invite_input:
      title: "Member Invite"
      message: "Enter the player name you want to invite"
      label: "Player Name"
    force_add_input:
      title: "Force Add Member"
      message: "Enter the player name you want to force add"
      label: "Player Name"
