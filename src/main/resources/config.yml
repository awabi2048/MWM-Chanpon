wizard:
  timeout_seconds: 300

archive:
  enabled: false

production:
  menu_slot: 40

submission:
  closed: false

tool_permissions:
  menu_slot: 5
  tools:
    worldedit:
      display_name: "WorldEdit"
      material: WOODEN_AXE
      color: "§a"
      permissions:
        - "worldedit.*"
    voxelsniper:
      display_name: "VoxelSniper"
      material: ARROW
      color: "§d"
      permissions:
        - "voxelsniper.*"
    axiom:
      display_name: "Axiom"
      material: ENDER_EYE
      color: "§b"
      permissions:
        - "axiom.*"

backup:
  owner_manual:
    cooldown_hours: 3
  auto_backup:
    enabled: false
    time: "04:00"
    last_run_date: ""
  auto_rollback:
    enabled: false
    time: "05:00"
    last_run_date: ""
  automation:
    check_interval_ticks: 1200
  retention:
    enabled: false
    keep:
      user_manual: 10
      admin_manual: 20
      scheduled: 14
      restore_point: 5
      pre_rollback: 10
