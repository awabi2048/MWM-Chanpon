name: MWMChanpon
main: me.awabi2048.mwmchanpon.MWMChanponPlugin
version: ${project.version}
api-version: "26.1.2"
depend:
  - CC-System
  - MyWorldManager
  - LuckPerms
  - WorldGuard
softdepend:
  - floodgate
  - Chanpon-Utilities

commands:
  chanpon-mwm:
    description: Chanponの管理メニューを開く
    usage: /chanpon-mwm
  preview-tour:
    description: プレビューツアーの状態確認・離脱
    usage: /preview-tour [leave]

permissions:
  mwmchanpon.admin:
    description: MWM-Chanponの管理者機能を使用する権限
    default: op
